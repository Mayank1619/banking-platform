spring.application.name=digital-banking-platform-backend
server.port=8080
 
#spring.datasource.url=jdbc:h2:mem:digitalbankdb
spring.datasource.url=jdbc:h2:file:./data/digitalbankdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
 
jwt.secret=${JWT_SECRET:ThisIsADevOnlySecretKeyForHs256JwtTokenMinimum32Chars}
jwt.access-token-expiry=3600
jwt.refresh-token-expiry=604800
 
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
 
# Logging
logging.file.name=logs/digital-banking.log
logging.level.root=INFO
logging.level.com.group1.banking=INFO
logging.level.org.springframework.security=INFO
logging.level.com.group1.banking.service.impl.RiskScoreService=DEBUG

server.forward-headers-strategy=framework

# YAML config
spring.config.import=classpath:risk-score-rules.yaml

# Load the repo-root .env file (one level up from backend/, where this app actually
# runs from) into the Spring Environment. Real OS/CI environment variables always
# take precedence over .env values; this file is purely a local-dev convenience and
# is a no-op if missing (see springboot4-dotenv dependency).
springdotenv.directory=..
springdotenv.ignore-if-missing=true

# ===== Savings Insight Chatbot (RAG) =====

# Groq chat model, accessed via Spring AI's OpenAI-compatible client.
spring.ai.model.chat=openai
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
# llama-3.3-70b-versatile was deprecated by Groq in June 2026 for free/developer tier -
# gpt-oss-120b is the recommended replacement. Override with GROQ_MODEL if you want a
# different model from https://console.groq.com/docs/models.
spring.ai.openai.chat.model=${GROQ_MODEL:openai/gpt-oss-120b}
# Temperature 0 + a fixed seed so the same question against the same customer data gives
# a consistent answer, which QA validates against expected output (T-BRD 6.1, Scenario 4).
# Applies to real usage too, deliberately: for savings guidance, stable answers are worth
# more than varied phrasing, and the warmth of the replies comes from the system prompt
# rather than from sampling randomness.
#
# This makes responses consistent, not byte-identical. Temperature 0 only fixes token
# selection - it doesn't make the inference stack reproduce identical logits - and Groq
# documents `seed` as best effort ("determinism is not guaranteed"). gpt-oss-120b is also
# a mixture-of-experts model served with batched inference, which adds its own variance.
# QA assertions should target structure, figures and decisions rather than exact strings.
spring.ai.openai.chat.temperature=0
spring.ai.openai.chat.seed=42

# Local ONNX embeddings (all-MiniLM-L6-v2, 384 dims) - Groq has no embeddings API.
spring.ai.model.embedding=transformers

# Second (Postgres) datasource used only by the chatbot: pgvector knowledge base +
# chat interaction log. The primary spring.datasource.* above stays H2/MySQL for
# all core banking data.
app.chatbot.vectorstore.datasource.url=${CHATBOT_DB_URL:jdbc:postgresql://localhost:5433/banking_chat}
app.chatbot.vectorstore.datasource.username=${CHATBOT_DB_USERNAME:banking_chat}
app.chatbot.vectorstore.datasource.password=${CHATBOT_DB_PASSWORD:banking_chat}
app.chatbot.vectorstore.datasource.driver-class-name=org.postgresql.Driver

# Savings knowledge base retrieval tuning
app.chatbot.knowledge-base.top-k=4
app.chatbot.knowledge-base.similarity-threshold=0.5
app.chatbot.transactions.lookback-days=30
app.chatbot.transactions.min-for-personalization=3
